name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://agencyos:agencyos_dev@127.0.0.1:5432/agencyos?schema=public
  TEST_DATABASE_URL: postgresql://agencyos:agencyos_dev@127.0.0.1:5432/agencyos_test?schema=public
  JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci-32chars
  JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci-32chars
  WEB_URL: http://localhost:3000
  API_INTERNAL_URL: http://127.0.0.1:4000
  NEXT_PUBLIC_API_URL: /api/v1
  NEXT_PUBLIC_DEMO_MODE: 'true'
  COOKIE_SECURE: 'false'

# The application lives in ./agencyos; this workflow file has to sit at the repository root
# for GitHub to pick it up.
defaults:
  run:
    working-directory: agencyos

jobs:
  verify:
    name: Lint, build, unit, integration, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos_dev
          POSTGRES_DB: agencyos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: agencyos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create integration database
        run: PGPASSWORD=agencyos_dev psql -h 127.0.0.1 -U agencyos -d agencyos -c 'CREATE DATABASE agencyos_test'

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Lint (API + Web)
        run: npm run lint

      - name: Build (API + Web)
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Apply migrations to the development database
        run: npm run db:deploy

      - name: Validate migration history
        run: npx prisma migrate status --schema apps/api/prisma/schema.prisma

      - name: Load deterministic seed data
        run: npm run db:seed
        env:
          NODE_ENV: development

      - name: Integration tests (real PostgreSQL, migrations applied by the test harness)
        run: npm run test:integration

      - name: OpenAPI export is up to date
        run: |
          npm run openapi
          git diff --exit-code -- docs/openapi.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production builds)
        run: npx playwright test
        env:
          NODE_ENV: development

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            agencyos/playwright-report
            agencyos/test-results
          retention-days: 7
