version: 2
updates:
  - package-ecosystem: npm
    directory: '/agencyos'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ['@nestjs/*']
      react:
        patterns: ['react', 'react-dom', 'next', 'eslint-config-next']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
